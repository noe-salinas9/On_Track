<title>On Track</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,600&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  /* ============ TOKENS ============ */
  :root{
    color-scheme: light;
    --bg: #FDF3F6;
    --surface: #FFFFFF;
    --surface-2: #FBF0F4;
    --surface-3: #F6E1EA;
    --line: #F0D6E2;
    --line-strong: #E1B4C8;
    --ink-900: #3B2432;
    --ink-700: #5B3E4C;
    --ink-600: #7A5568;
    --ink-400: #A7889A;
    --brand: #B23A63;
    --brand-ink: #FFFFFF;
    --accent: #C68A3D;
    --accent-strong: #A96F2C;
    --accent-soft: #FBEAD2;
    --accent-ink: #3B2432;
    --good: #0ca30c;
    --good-text: #006300;
    --good-soft: #E4F5E1;
    --warning: #fab219;
    --warning-soft: #FBEBCF;
    --serious: #ec835a;
    --serious-soft: #FBE3D8;
    --critical: #d03b3b;
    --critical-soft: #FBE1DF;
    --cat-1: #2a78d6; --cat-2: #eb6834; --cat-3: #1baf7a; --cat-4: #c98500;
    --cat-5: #e87ba4; --cat-6: #008300; --cat-7: #4a3aa7; --cat-8: #e34948;
    --shadow-1: 0 1px 2px rgba(90,30,55,0.08), 0 1px 1px rgba(90,30,55,0.05);
    --shadow-2: 0 6px 20px rgba(90,30,55,0.14), 0 2px 6px rgba(90,30,55,0.08);
    --radius: 18px;
    --radius-sm: 12px;
    --font-display: 'Playfair Display', Georgia, 'Times New Roman', serif;
    --font-body: 'Quicksand', ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    --font-mono: 'Quicksand', ui-sans-serif, system-ui, sans-serif;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      color-scheme: dark;
      --bg: #23111C;
      --surface: #331C2B;
      --surface-2: #3D2233;
      --surface-3: #492A3D;
      --line: #58314A;
      --line-strong: #6E3D5A70;
      --ink-900: #F8EAF0;
      --ink-700: #E3C9D6;
      --ink-600: #C7A3B8;
      --ink-400: #9C7891;
      --brand: #E37FA6;
      --brand-ink: #2A0F1E;
      --accent: #E3B36A;
      --accent-strong: #F0C685;
      --accent-soft: #40301A;
      --accent-ink: #2A1810;
      --good: #0ca30c;
      --good-text: #0ca30c;
      --good-soft: #163524;
      --warning: #fab219;
      --warning-soft: #3A2C0F;
      --serious: #ec835a;
      --serious-soft: #3A2418;
      --critical: #d03b3b;
      --critical-soft: #3A1E1E;
      --cat-1: #3987e5; --cat-2: #d95926; --cat-3: #199e70; --cat-4: #c98500;
      --cat-5: #d55181; --cat-6: #008300; --cat-7: #9085e9; --cat-8: #e66767;
      --shadow-1: 0 1px 2px rgba(0,0,0,0.35);
      --shadow-2: 0 10px 24px rgba(0,0,0,0.45);
    }
  }
  :root[data-theme="dark"]{
    color-scheme: dark;
    --bg: #23111C; --surface: #331C2B; --surface-2: #3D2233; --surface-3: #492A3D;
    --line: #58314A; --line-strong: #6E3D5A70;
    --ink-900: #F8EAF0; --ink-700: #E3C9D6; --ink-600: #C7A3B8; --ink-400: #9C7891;
    --brand: #E37FA6; --brand-ink: #2A0F1E;
    --accent: #E3B36A; --accent-strong: #F0C685; --accent-soft: #40301A; --accent-ink: #2A1810;
    --good: #0ca30c; --good-text: #0ca30c; --good-soft: #163524;
    --warning: #fab219; --warning-soft: #3A2C0F;
    --serious: #ec835a; --serious-soft: #3A2418;
    --critical: #d03b3b; --critical-soft: #3A1E1E;
    --cat-1: #3987e5; --cat-2: #d95926; --cat-3: #199e70; --cat-4: #c98500;
    --cat-5: #d55181; --cat-6: #008300; --cat-7: #9085e9; --cat-8: #e66767;
    --shadow-1: 0 1px 2px rgba(0,0,0,0.35);
    --shadow-2: 0 10px 24px rgba(0,0,0,0.45);
  }

  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; }
  body{
    background:var(--bg);
    color:var(--ink-900);
    font-family:var(--font-body);
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  h1,h2,h3{ font-family:var(--font-display); font-weight:600; text-wrap:balance; margin:0; }
  .mono{ font-family:var(--font-mono); font-variant-numeric:tabular-nums; }
  button{ font-family:inherit; }
  input,select,textarea{ font-family:inherit; font-size:16px; }
  a{ color:var(--accent); }
  [hidden]{ display:none !important; }

  /* ============ AUTH GATE ============ */
  .auth-gate{
    min-height:100vh; min-height:100dvh;
    display:flex; align-items:center; justify-content:center;
    padding:24px; background:var(--bg);
  }
  .auth-card{ max-width:380px; width:100%; }
  .auth-card .brandmark{
    font-family:var(--font-display); font-weight:600; font-size:1.5rem; letter-spacing:0.01em;
    display:flex; align-items:baseline; gap:8px; justify-content:center;
  }
  .auth-card .brandmark .dot{ color:var(--accent); }

  /* ============ SHELL ============ */
  #app{
    max-width: 1180px;
    margin: 0 auto;
    min-height: 100vh;
    display:flex;
    flex-direction:column;
  }
  .topbar{
    position:sticky; top:0; z-index:20;
    background:var(--brand);
    color:var(--brand-ink);
    padding: calc(env(safe-area-inset-top,0px) + 14px) 18px 14px;
    display:flex; align-items:center; justify-content:space-between; gap:12px;
    box-shadow: var(--shadow-1);
  }
  .topbar .brandmark{
    font-family:var(--font-display); font-weight:600; font-size:1.25rem; letter-spacing:0.01em;
    display:flex; align-items:baseline; gap:8px;
  }
  .topbar .brandmark .dot{ color:var(--accent); }
  .sync-badge{
    display:flex; align-items:center; gap:6px;
    font-size:0.72rem; font-weight:500; padding:5px 10px 5px 8px;
    border-radius:999px; background:rgba(255,255,255,0.12); color:var(--brand-ink);
    white-space:nowrap;
  }
  .sync-badge .led{ width:7px; height:7px; border-radius:50%; background:#7CD98A; box-shadow:0 0 0 3px rgba(124,217,138,0.25); }
  .sync-badge.local .led{ background:#E0A736; box-shadow:0 0 0 3px rgba(224,167,54,0.25); }
  .sync-badge.readonly .led{ background:#E06767; box-shadow:0 0 0 3px rgba(224,103,103,0.25); }

  main#view-root{ flex:1; padding: 16px 16px 96px; width:100%; }

  .tabbar{
    position:fixed; left:0; right:0; bottom:0; z-index:30;
    background:var(--surface);
    border-top:1px solid var(--line);
    display:flex;
    padding-bottom: env(safe-area-inset-bottom,0px);
    box-shadow: 0 -2px 12px rgba(22,32,43,0.06);
  }
  .tabbar button{
    flex:1; background:none; border:none; cursor:pointer;
    display:flex; flex-direction:column; align-items:center; gap:3px;
    padding:9px 4px 8px; color:var(--ink-400); font-size:0.68rem; font-weight:500;
  }
  .tabbar button .ic{ font-size:1.18rem; line-height:1; }
  .tabbar button[aria-current="true"]{ color:var(--accent); }
  .tabbar button[aria-current="true"] .ic{ transform:translateY(-1px); }

  .fab{
    position:fixed; right:18px; bottom:76px; z-index:25;
    width:56px; height:56px; border-radius:50%;
    background:var(--accent); color:var(--accent-ink); border:none;
    font-size:1.6rem; line-height:1; cursor:pointer;
    box-shadow: var(--shadow-2);
    display:flex; align-items:center; justify-content:center;
  }
  .fab:active{ transform:scale(0.96); }

  @media (min-width: 860px){
    #app{ flex-direction:row; }
    .topbar{ position:fixed; top:0; left:0; right:0; }
    .sidebar{
      display:flex; flex-direction:column; gap:2px;
      width:220px; flex-shrink:0;
      background:var(--surface); border-right:1px solid var(--line);
      padding: 84px 12px 20px; position:sticky; top:0; height:100vh;
    }
    .sidebar button{
      display:flex; align-items:center; gap:10px; text-align:left;
      background:none; border:none; cursor:pointer; color:var(--ink-600);
      padding:11px 12px; border-radius:var(--radius-sm); font-size:0.92rem; font-weight:500;
    }
    .sidebar button .ic{ font-size:1.05rem; }
    .sidebar button[aria-current="true"]{ background:var(--accent-soft); color:var(--accent-strong); }
    .tabbar{ display:none; }
    main#view-root{ padding: 100px 28px 40px; max-width: 900px; }
    .fab{ right:40px; bottom:32px; }
  }

  /* ============ PRIMITIVES ============ */
  .stack{ display:flex; flex-direction:column; gap:12px; }
  .row{ display:flex; align-items:center; gap:10px; }
  .between{ justify-content:space-between; }
  .card{
    background:var(--surface); border:1px solid var(--line); border-radius:var(--radius);
    padding:16px; box-shadow:var(--shadow-1);
  }
  .muted{ color:var(--ink-400); }
  .secondary-text{ color:var(--ink-600); }
  .section-title{
    font-family:var(--font-display); font-weight:600; font-size:1.02rem; color:var(--ink-900);
    margin: 4px 0 2px;
  }
  .eyebrow{
    text-transform:uppercase; letter-spacing:0.08em; font-size:0.7rem; font-weight:600; color:var(--ink-400);
  }

  .stat-grid{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  @media (min-width:560px){ .stat-grid{ grid-template-columns:repeat(4,1fr); } }
  .stat-tile{
    background:var(--surface); border:1px solid var(--line); border-radius:var(--radius);
    padding:14px; box-shadow:var(--shadow-1);
  }
  .stat-tile .label{ font-size:0.74rem; color:var(--ink-400); font-weight:500; margin-bottom:6px; }
  .stat-tile .value{ font-family:var(--font-mono); font-size:1.32rem; font-weight:600; letter-spacing:-0.01em; }
  .stat-tile .value.good{ color:var(--good-text); }
  .stat-tile .value.critical{ color:var(--critical); }
  .stat-tile .sub{ font-size:0.72rem; color:var(--ink-400); margin-top:4px; }

  .pill{
    display:inline-flex; align-items:center; gap:5px;
    padding:3px 9px; border-radius:999px; font-size:0.72rem; font-weight:600;
  }
  .pill .dot{ width:6px; height:6px; border-radius:50%; }
  .pill.good{ background:var(--good-soft); color:var(--good); }
  .pill.warning{ background:var(--warning-soft); color:var(--warning); }
  .pill.serious{ background:var(--serious-soft); color:var(--serious); }
  .pill.critical{ background:var(--critical-soft); color:var(--critical); }
  .pill.neutral{ background:var(--surface-3); color:var(--ink-600); }
  .pill .dot.good{ background:var(--good); } .pill .dot.warning{ background:var(--warning); }
  .pill .dot.serious{ background:var(--serious); } .pill .dot.critical{ background:var(--critical); }
  .pill .dot.neutral{ background:var(--ink-400); }

  .btn{
    appearance:none; border:none; cursor:pointer; border-radius:var(--radius-sm);
    padding:11px 16px; font-size:0.92rem; font-weight:600; display:inline-flex; align-items:center; gap:7px; justify-content:center;
  }
  .btn-primary{ background:var(--accent); color:var(--accent-ink); }
  .btn-brand{ background:var(--brand); color:var(--brand-ink); }
  .btn-ghost{ background:var(--surface-3); color:var(--ink-700); }
  .btn-line{ background:transparent; color:var(--ink-700); border:1px solid var(--line-strong); }
  .btn-danger{ background:var(--critical-soft); color:var(--critical); }
  .btn-block{ width:100%; }
  .btn-sm{ padding:7px 12px; font-size:0.8rem; }
  .btn:disabled{ opacity:0.5; cursor:not-allowed; }
  .icon-btn{
    background:none; border:none; cursor:pointer; color:var(--ink-400);
    width:32px; height:32px; display:flex; align-items:center; justify-content:center;
    border-radius:8px; font-size:1rem;
  }
  .icon-btn:hover{ background:var(--surface-3); color:var(--ink-700); }

  .month-nav{ display:flex; align-items:center; gap:10px; }
  .month-nav .lbl{ font-weight:600; min-width:132px; text-align:center; font-family:var(--font-display); font-size:1rem; }

  .empty-state{
    text-align:center; padding:40px 18px; color:var(--ink-600);
    border:1px dashed var(--line-strong); border-radius:var(--radius); background:var(--surface-2);
  }
  .empty-state .big-ic{ font-size:2.2rem; margin-bottom:10px; }
  .empty-state h3{ margin-bottom:6px; }
  .empty-state p{ font-size:0.88rem; max-width:32ch; margin:0 auto 14px; line-height:1.5; }

  /* ledger card for tarjetas */
  .ledger-card{
    background:var(--surface); border:1px solid var(--line); border-radius:var(--radius);
    padding:14px 14px 14px 16px; box-shadow:var(--shadow-1);
    border-left:4px solid var(--ink-400);
    display:flex; flex-direction:column; gap:10px; cursor:pointer;
  }
  .ledger-card.good{ border-left-color:var(--good); }
  .ledger-card.warning{ border-left-color:var(--warning); }
  .ledger-card.serious{ border-left-color:var(--serious); }
  .ledger-card.critical{ border-left-color:var(--critical); }
  .card-avatar{
    width:34px; height:34px; border-radius:9px; flex-shrink:0;
    display:flex; align-items:center; justify-content:center;
    font-family:var(--font-display); font-weight:600; font-size:0.85rem; color:#fff;
  }
  .card-head{ display:flex; align-items:center; gap:10px; }
  .card-head .names{ flex:1; min-width:0; }
  .card-head .alias{ font-weight:600; font-size:0.96rem; }
  .card-head .bank{ font-size:0.78rem; color:var(--ink-400); }
  .card-balance{ display:flex; justify-content:space-between; align-items:baseline; }
  .card-balance .amt{ font-family:var(--font-mono); font-size:1.28rem; font-weight:600; }
  .limit-bar{ height:6px; border-radius:99px; background:var(--surface-3); overflow:hidden; }
  .limit-bar > div{ height:100%; background:var(--accent); border-radius:99px; }
  .card-dates{ display:flex; gap:16px; flex-wrap:wrap; font-size:0.78rem; }
  .card-dates .k{ color:var(--ink-400); }
  .card-dates .v{ font-weight:600; }

  /* forecast table (calendario de próximos meses) */
  .forecast-scroll{ overflow-x:auto; margin:0 -4px; padding:0 4px; }
  .forecast-table{ border-collapse:collapse; width:100%; min-width:520px; font-size:0.82rem; }
  .forecast-table th, .forecast-table td{ padding:9px 10px; text-align:right; white-space:nowrap; }
  .forecast-table th{ font-size:0.68rem; text-transform:uppercase; letter-spacing:0.04em; color:var(--ink-400); font-weight:600; border-bottom:1px solid var(--line); }
  .forecast-table td.rowlbl, .forecast-table th:first-child{ text-align:left; }
  .forecast-table td.rowlbl{ font-weight:500; color:var(--ink-700); }
  .forecast-table tbody tr{ border-bottom:1px solid var(--line); }
  .forecast-table td{ font-family:var(--font-mono); font-variant-numeric:tabular-nums; color:var(--ink-700); }
  .forecast-table tr.totalrow{ border-bottom:none; border-top:1px solid var(--line-strong); }
  .forecast-table tr.totalrow td{ font-weight:700; color:var(--ink-900); }
  .forecast-table tr.totalrow td.rowlbl{ font-family:var(--font-display); }
  .forecast-table td.zero{ color:var(--ink-400); font-family:inherit; }

  /* movement list */
  .mov-day-group .day-lbl{ font-size:0.74rem; font-weight:600; color:var(--ink-400); margin:14px 0 6px; text-transform:capitalize; }
  .mov-row{
    display:flex; align-items:center; gap:11px; padding:11px 4px; border-bottom:1px solid var(--line);
    cursor:pointer;
  }
  .mov-row:last-child{ border-bottom:none; }
  .mov-ic{
    width:36px; height:36px; border-radius:10px; flex-shrink:0;
    display:flex; align-items:center; justify-content:center; font-size:1.02rem; color:#fff;
  }
  .mov-info{ flex:1; min-width:0; }
  .mov-info .t1{ font-weight:500; font-size:0.9rem; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .mov-info .t2{ font-size:0.76rem; color:var(--ink-400); }
  .mov-amt{ font-family:var(--font-mono); font-weight:600; font-size:0.92rem; white-space:nowrap; }
  .mov-amt.ingreso{ color:var(--good-text); }
  .mov-amt.credito{ color:var(--accent-strong); }

  /* bars chart */
  .barchart{ display:flex; flex-direction:column; gap:10px; }
  .bar-row{ display:grid; grid-template-columns: 96px 1fr auto; gap:10px; align-items:center; }
  .bar-row .name{ font-size:0.8rem; color:var(--ink-700); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .bar-track{ height:10px; border-radius:99px; background:var(--surface-3); overflow:hidden; }
  .bar-fill{ height:100%; border-radius:99px; }
  .bar-row .val{ font-family:var(--font-mono); font-size:0.78rem; color:var(--ink-600); white-space:nowrap; }

  /* installment items */
  .plazo-item{ padding:12px 0; border-bottom:1px solid var(--line); }
  .plazo-item:last-child{ border-bottom:none; }
  .plazo-top{ display:flex; justify-content:space-between; gap:10px; align-items:baseline; margin-bottom:6px; }
  .plazo-top .desc{ font-weight:500; font-size:0.9rem; }
  .plazo-top .tot{ font-family:var(--font-mono); font-size:0.86rem; color:var(--ink-600); }
  .plazo-meta{ display:flex; justify-content:space-between; font-size:0.76rem; color:var(--ink-400); margin-top:6px; }

  /* forms */
  .field{ display:flex; flex-direction:column; gap:6px; }
  .field label{ font-size:0.78rem; font-weight:600; color:var(--ink-600); }
  .field .hint{ font-size:0.72rem; color:var(--ink-400); }
  .field input[type="text"], .field input[type="number"], .field input[type="date"],
  .field select, .field textarea{
    background:var(--surface-2); border:1px solid var(--line); border-radius:var(--radius-sm);
    padding:11px 12px; color:var(--ink-900); width:100%;
  }
  .field input:focus, .field select:focus, .field textarea:focus{
    outline:2px solid var(--accent); outline-offset:1px; border-color:var(--accent);
  }
  .seg{ display:flex; gap:6px; background:var(--surface-2); padding:4px; border-radius:var(--radius-sm); border:1px solid var(--line); }
  .seg button{
    flex:1; border:none; background:none; padding:9px 6px; border-radius:8px; font-size:0.84rem; font-weight:600;
    color:var(--ink-600); cursor:pointer;
  }
  .seg button[aria-selected="true"]{ background:var(--surface); color:var(--ink-900); box-shadow:var(--shadow-1); }
  .checkline{ display:flex; align-items:center; gap:9px; }
  .checkline input[type="checkbox"]{ width:18px; height:18px; accent-color:var(--accent); }
  .checkline label{ font-size:0.86rem; font-weight:500; color:var(--ink-700); }
  .form-actions{ display:flex; gap:10px; margin-top:6px; }
  .form-actions .btn{ flex:1; }
  .error-text{ color:var(--critical); font-size:0.78rem; }

  /* modal */
  .modal-overlay{
    position:fixed; inset:0; background:rgba(16,22,29,0.5); z-index:50;
    display:flex; align-items:flex-end; justify-content:center;
  }
  @media (min-width:640px){ .modal-overlay{ align-items:center; } }
  .modal-sheet{
    background:var(--surface); width:100%; max-width:480px; max-height:90vh; overflow-y:auto;
    border-radius:20px 20px 0 0; padding:18px 18px calc(env(safe-area-inset-bottom,0px) + 18px);
    box-shadow:var(--shadow-2);
  }
  @media (min-width:640px){ .modal-sheet{ border-radius:var(--radius); padding:22px; } }
  .modal-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; }
  .modal-head h2{ font-size:1.08rem; }
  .modal-grab{ width:36px; height:4px; border-radius:99px; background:var(--line-strong); margin:0 auto 14px; }
  @media (min-width:640px){ .modal-grab{ display:none; } }

  /* toast */
  #toast-layer{ position:fixed; left:0; right:0; bottom:88px; z-index:70; display:flex; flex-direction:column; align-items:center; gap:8px; pointer-events:none; }
  @media (min-width:860px){ #toast-layer{ bottom:24px; } }
  .toast{
    background:var(--ink-900); color:var(--bg); padding:10px 16px; border-radius:99px; font-size:0.84rem; font-weight:500;
    box-shadow:var(--shadow-2); animation: toast-in 0.18s ease-out;
  }
  @keyframes toast-in{ from{ opacity:0; transform:translateY(6px);} to{ opacity:1; transform:translateY(0);} }

  .disclaimer{
    font-size:0.76rem; line-height:1.55; color:var(--ink-400); background:var(--surface-2);
    border:1px solid var(--line); border-radius:var(--radius-sm); padding:12px 13px;
  }
  .disclaimer strong{ color:var(--ink-600); }

  ::selection{ background:var(--accent-soft); }

<div id="toast-layer"></div>

<script>
(function(){
  "use strict";

  /* ============================================================
     0. CONSTANTES Y UTILIDADES BASE
     ============================================================ */
  var GASTO_CATS = ['Alimentos','Transporte','Vivienda','Servicios (luz, agua, internet)','Salud','Educación','Entretenimiento','Ropa','Cuidado personal','Mascotas','Suscripciones','Otros'];
  var INGRESO_CATS = ['Sueldo','Negocio propio','Freelance','Reembolso','Regalo','Otros ingresos'];
  var CAT_SLOT = {}; // nombre categoría -> 1..8
  (function(){
    var order = ['Alimentos','Transporte','Vivienda','Servicios (luz, agua, internet)','Salud','Educación','Entretenimiento','Ropa','Cuidado personal','Mascotas','Suscripciones','Otros','Sueldo','Negocio propio','Freelance','Reembolso','Regalo','Otros ingresos'];
    order.forEach(function(name, i){ CAT_SLOT[name] = (i % 8) + 1; });
  })();
  function slotForCategory(name){
    if (CAT_SLOT[name]) return CAT_SLOT[name];
    // hash estable para categorías personalizadas
    var h = 0;
    for (var i=0;i<name.length;i++){ h = (h*31 + name.charCodeAt(i)) >>> 0; }
    return (h % 8) + 1;
  }
  function catColorVar(name){ return 'var(--cat-' + slotForCategory(name) + ')'; }

  var MXN = new Intl.NumberFormat('es-MX', { style:'currency', currency:'MXN', maximumFractionDigits:2 });
  function fmtMoney(n){ return MXN.format(Number(n)||0); }
  function pad(n){ return String(n).padStart(2,'0'); }
  function toISO(d){ return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
  function parseISO(s){ var p = s.split('-').map(Number); return new Date(p[0], p[1]-1, p[2]); }
  function todayDate(){ var d = new Date(); return new Date(d.getFullYear(), d.getMonth(), d.getDate()); }
  var MESES = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
  var MESES_CORTOS = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
  var DIAS_SEM = ['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
  function fmtDateLong(d){ return d.getDate() + ' de ' + MESES[d.getMonth()] + ' ' + d.getFullYear(); }
  function fmtDateShort(d){ return d.getDate() + ' ' + MESES_CORTOS[d.getMonth()]; }
  function monthKey(d){ return d.getFullYear() + '-' + pad(d.getMonth()+1); }
  function monthLabel(key){ var p = key.split('-').map(Number); var m = MESES[p[1]-1]; return m.charAt(0).toUpperCase()+m.slice(1) + ' ' + p[0]; }
  function uid(){
    if (window.crypto && crypto.randomUUID) return crypto.randomUUID().replace(/-/g,'').slice(0,16);
    return Date.now().toString(36) + Math.random().toString(36).slice(2,10);
  }
  function escapeHtml(s){
    return String(s==null?'':s).replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }

  /* ---- lógica de fechas verificada (ver pruebas en el chat) ---- */
  function nextOccurrenceOfDay(fromDate, day){
    var from = new Date(fromDate.getFullYear(), fromDate.getMonth(), fromDate.getDate());
    var y = from.getFullYear(), m = from.getMonth();
    function lastDay(year, month){ return new Date(year, month+1, 0).getDate(); }
    function candidate(year, month){ var d = Math.min(day, lastDay(year, month)); return new Date(year, month, d); }
    var c = candidate(y, m);
    if (c < from) { m += 1; if (m > 11){ m = 0; y += 1; } c = candidate(y, m); }
    return c;
  }
  function daysBetween(a, b){
    var MS = 86400000;
    var a0 = new Date(a.getFullYear(), a.getMonth(), a.getDate());
    var b0 = new Date(b.getFullYear(), b.getMonth(), b.getDate());
    return Math.round((b0 - a0) / MS);
  }
  function statusForDays(days){
    if (days <= 2) return 'critical';
    if (days <= 7) return 'serious';
    if (days <= 15) return 'warning';
    return 'good';
  }
  function statusLabel(status, days){
    if (days < 0) return 'Vencido hace ' + Math.abs(days) + ' d' + (Math.abs(days)===1?'ía':'ías');
    if (days === 0) return 'Es hoy';
    if (days === 1) return 'Mañana';
    return 'En ' + days + ' días';
  }

  /* ============================================================
     1. BACKEND (Google Apps Script + Sheets) — fuente de verdad
     Esta app comparte el mismo backend que Al Corte, identificada por
     su propio PERSON_ID fijo ('liz'). Los datos NO viven en este
     documento — viven en la hoja de cálculo, protegidos por el PIN
     que Liz elige la primera vez que abre su app.
     ============================================================ */
  var PERSON_ID = 'liz';
  var BACKEND_URL = 'https://script.google.com/macros/s/AKfycbznTBEvC6Rbm5yJm-MNdGeeCM7qu3h2ez5RB-nwlgeJsnySPO3bNuic7gRPd9WCDAem/exec';
  var AUTH_CACHE_KEY = 'ontrack_auth_v1';

  var AUTH = { pinHash: null };
  var DATA = { cards: [], movs: [], loans: [] };

  async function sha256Hex(text){
    var buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(text));
    return Array.prototype.map.call(new Uint8Array(buf), function(b){ return b.toString(16).padStart(2,'0'); }).join('');
  }

  async function apiGet(params){
    var qs = Object.keys(params).map(function(k){ return encodeURIComponent(k)+'='+encodeURIComponent(params[k]); }).join('&');
    var res = await fetch(BACKEND_URL + '?' + qs);
    return res.json();
  }
  async function apiPost(body){
    var res = await fetch(BACKEND_URL, { method:'POST', body: JSON.stringify(body) });
    return res.json();
  }
  async function apiSave(entity, op, id, data){
    var res;
    try{
      res = await apiPost({ action:'save', personId:PERSON_ID, pinHash:AUTH.pinHash, entity:entity, op:op, id:id||undefined, data:data||{} });
    }catch(e){
      setConnStatus(false);
      toast('Sin conexión — no se pudo guardar. Revisa tu internet e intenta de nuevo.');
      throw e;
    }
    if (!res.ok){
      setConnStatus(true);
      toast('No se pudo guardar: ' + (res.error || 'error desconocido'));
      throw new Error(res.error || 'save_failed');
    }
    setConnStatus(true);
    return res;
  }

  function getCards(){ return DATA.cards; }
  function getMovs(){ return DATA.movs; }
  function getLoans(){ return DATA.loans; }
  function findCard(id){ return getCards().filter(function(c){ return c.id===id; })[0] || null; }
  function findLoan(id){ return getLoans().filter(function(l){ return l.id===id; })[0] || null; }

  async function loadAllData(){
    var res = await apiGet({ action:'getAll', personId:PERSON_ID, pinHash:AUTH.pinHash });
    if (!res.ok) throw new Error(res.error || 'getAll_failed');
    DATA.cards = res.tarjetas || [];
    DATA.movs = res.movimientos || [];
    DATA.loans = res.prestamos || [];
  }

  async function addCard(data){
    var res = await apiSave('tarjeta', 'add', null, data);
    var copy = Object.assign({}, data); copy.id = res.id;
    DATA.cards.push(copy);
    return res.id;
  }
  async function updateCard(id, data){
    await apiSave('tarjeta', 'update', id, data);
    var copy = Object.assign({}, data); copy.id = id;
    var idx = DATA.cards.findIndex(function(c){ return c.id===id; });
    if (idx>=0) DATA.cards[idx] = copy; else DATA.cards.push(copy);
  }
  async function removeCard(id){
    // también borra (en el backend) los movimientos asociados a esa tarjeta
    var relacionados = DATA.movs.filter(function(m){ return m.cardId===id; });
    for (var i=0;i<relacionados.length;i++){ await removeMov(relacionados[i].id); }
    await apiSave('tarjeta', 'delete', id, null);
    DATA.cards = DATA.cards.filter(function(c){ return c.id!==id; });
  }
  async function addMov(data){
    var res = await apiSave('movimiento', 'add', null, data);
    var copy = Object.assign({}, data); copy.id = res.id; if (!copy.pagos) copy.pagos = [];
    DATA.movs.push(copy);
    return res.id;
  }
  async function updateMov(id, data){
    await apiSave('movimiento', 'update', id, data);
    var copy = Object.assign({}, data); copy.id = id;
    var idx = DATA.movs.findIndex(function(m){ return m.id===id; });
    if (idx>=0) DATA.movs[idx] = copy; else DATA.movs.push(copy);
  }
  async function removeMov(id){
    await apiSave('movimiento', 'delete', id, null);
    DATA.movs = DATA.movs.filter(function(m){ return m.id!==id; });
  }

  async function markPlazoPaid(movId){
    var m = getMovs().filter(function(x){ return x.id===movId; })[0]; if (!m) return;
    var total = Number(m.plazosTotal)||1;
    var pagos = (m.pagos||[]).slice();
    if (pagos.length >= total) return;
    pagos.push(toISO(todayDate()));
    var data = Object.assign({}, m); delete data.id; data.pagos = pagos;
    await updateMov(movId, data);
    toast('Mes marcado como pagado');
  }
  async function undoPlazoPaid(movId){
    var m = getMovs().filter(function(x){ return x.id===movId; })[0]; if (!m) return;
    var pagos = (m.pagos||[]).slice(0, -1);
    var data = Object.assign({}, m); delete data.id; data.pagos = pagos;
    await updateMov(movId, data);
    toast('Se deshizo el último mes marcado');
  }

  async function addLoan(data){
    var res = await apiSave('prestamo', 'add', null, data);
    var copy = Object.assign({}, data); copy.id = res.id; if (!copy.abonos) copy.abonos = [];
    DATA.loans.push(copy);
    return res.id;
  }
  async function updateLoan(id, data){
    await apiSave('prestamo', 'update', id, data);
    var copy = Object.assign({}, data); copy.id = id;
    var idx = DATA.loans.findIndex(function(l){ return l.id===id; });
    if (idx>=0) DATA.loans[idx] = copy; else DATA.loans.push(copy);
  }
  async function removeLoan(id){
    await apiSave('prestamo', 'delete', id, null);
    DATA.loans = DATA.loans.filter(function(l){ return l.id!==id; });
  }
  async function addAbono(loanId, monto, fecha){
    var l = findLoan(loanId); if (!l) return;
    var abonos = (l.abonos||[]).slice();
    abonos.push({ fecha: fecha, monto: Math.round(monto*100)/100 });
    var data = Object.assign({}, l); delete data.id; data.abonos = abonos;
    await updateLoan(loanId, data);
    toast('Abono registrado');
  }
  async function undoAbono(loanId){
    var l = findLoan(loanId); if (!l) return;
    var abonos = (l.abonos||[]).slice(0, -1);
    var data = Object.assign({}, l); delete data.id; data.abonos = abonos;
    await updateLoan(loanId, data);
    toast('Se deshizo el último abono');
  }

  async function wipeAllRemote(){
    var movs = DATA.movs.slice();
    for (var i=0;i<movs.length;i++){ await removeMov(movs[i].id); }
    var loans = DATA.loans.slice();
    for (var i=0;i<loans.length;i++){ await removeLoan(loans[i].id); }
    var cards = DATA.cards.slice();
    for (var i=0;i<cards.length;i++){ await apiSave('tarjeta', 'delete', cards[i].id, null); }
    DATA.cards = [];
  }

  function saldoPrestamo(loan){
    var abonado = (loan.abonos||[]).reduce(function(s,a){ return s+Number(a.monto||0); }, 0);
    return Math.max(0, Math.round((Number(loan.monto||0) - abonado) * 100) / 100);
  }

  function saldoTarjeta(cardId, movs){
    movs = movs || getMovs();
    var compras = 0, pagos = 0;
    movs.forEach(function(m){
      if (m.tipo==='gasto' && m.metodo==='credito' && m.cardId===cardId) compras += Number(m.monto)||0;
      if (m.tipo==='pago_tarjeta' && m.cardId===cardId) pagos += Number(m.monto)||0;
    });
    return Math.round((compras - pagos) * 100) / 100;
  }

  /* ============================================================
     2. ESTADO DE NAVEGACIÓN (solo de este dispositivo, no sincronizado)
     ============================================================ */
  var ui = {
    view: 'resumen',
    monthKey: monthKey(new Date()),
    editingMov: null,
    editingCard: null
  };

  /* ============================================================
     3. RENDER
     ============================================================ */
  var viewRoot = document.getElementById('view-root');

  function render(){
    if (ui.view === 'resumen') viewRoot.innerHTML = renderResumen();
    else if (ui.view === 'movimientos') viewRoot.innerHTML = renderMovimientos();
    else if (ui.view === 'tarjetas') viewRoot.innerHTML = renderTarjetas();
    else if (ui.view === 'plazos') viewRoot.innerHTML = renderPlazos();
    else if (ui.view === 'prestamos') viewRoot.innerHTML = renderPrestamos();
    else if (ui.view === 'ajustes') viewRoot.innerHTML = renderAjustes();
    document.querySelectorAll('#tabbar [data-view], #sidebar [data-view]').forEach(function(b){
      b.setAttribute('aria-current', b.dataset.view === ui.view ? 'true' : 'false');
    });
    var fab = document.getElementById('fab-add');
    fab.hidden = (ui.view === 'ajustes');
    var fabLabel = ui.view === 'tarjetas' ? 'Agregar tarjeta' : (ui.view === 'prestamos' ? 'Agregar préstamo' : 'Agregar movimiento');
    fab.title = fabLabel; fab.setAttribute('aria-label', fabLabel);
    wireViewEvents();
  }

  function statTileHtml(label, value, cls, sub){
    return '<div class="stat-tile"><div class="label">'+escapeHtml(label)+'</div><div class="value'+(cls?(' '+cls):'')+'">'+value+'</div>'+(sub?'<div class="sub">'+sub+'</div>':'')+'</div>';
  }

  function monthNavHtml(){
    return '<div class="row between" style="margin-bottom:14px;">' +
      '<div class="month-nav">' +
        '<button class="icon-btn" data-act="month-prev">‹</button>' +
        '<div class="lbl">' + monthLabel(ui.monthKey) + '</div>' +
        '<button class="icon-btn" data-act="month-next">›</button>' +
      '</div>' +
    '</div>';
  }

  function renderResumen(){
    var cards = getCards(), movs = getMovs();
    var hoy = todayDate();
    var monthMovs = movs.filter(function(m){ return monthKey(parseISO(m.fecha)) === ui.monthKey; });

    var ingresos = monthMovs.filter(function(m){ return m.tipo==='ingreso'; }).reduce(function(s,m){ return s+Number(m.monto||0); },0);
    var salidasEfectivo = monthMovs.filter(function(m){ return (m.tipo==='gasto' && m.metodo!=='credito' && m.metodo!=='bnpl') || m.tipo==='pago_tarjeta'; })
      .reduce(function(s,m){ return s+Number(m.monto||0); },0);
    // Mensualidades de "compra ahora, paga después" que marcaste como pagadas este mes:
    // como no pasan por una tarjeta, esta marca ES el registro de que ese dinero salió de tu bolsillo.
    var bnplEsteMes = 0;
    movs.filter(function(m){ return m.esPlazos && m.tipoPlazo==='bnpl'; }).forEach(function(m){
      var mensualidad = Math.round((Number(m.monto)/(Number(m.plazosTotal)||1)) * 100) / 100;
      (m.pagos||[]).forEach(function(f){ if (monthKey(parseISO(f)) === ui.monthKey) bnplEsteMes += mensualidad; });
    });
    salidasEfectivo += bnplEsteMes;
    // Préstamos: dar o recibir dinero prestado mueve tu efectivo igual que cualquier
    // otro ingreso/gasto — el momento en que entrega/recibe el dinero, y cada abono.
    getLoans().forEach(function(l){
      if (monthKey(parseISO(l.fecha)) === ui.monthKey){
        if (l.tipo === 'recibido') ingresos += Number(l.monto||0);
        else salidasEfectivo += Number(l.monto||0);
      }
      (l.abonos||[]).forEach(function(a){
        if (monthKey(parseISO(a.fecha)) === ui.monthKey){
          if (l.tipo === 'otorgado') ingresos += Number(a.monto||0);
          else salidasEfectivo += Number(a.monto||0);
        }
      });
    });
    var balance = ingresos - salidasEfectivo;

    var creditCards = cards.filter(function(c){ return c.tipo==='credito'; });
    var deudaTotal = creditCards.reduce(function(s,c){ return s + saldoTarjeta(c.id, movs); }, 0);
    var limiteTotal = creditCards.reduce(function(s,c){ return s + (Number(c.limite)||0); }, 0);
    var usoPct = limiteTotal>0 ? Math.round((deudaTotal/limiteTotal)*100) : null;

    var html = '';
    html += monthNavHtml();
    html += '<div class="eyebrow" style="margin-bottom:8px;">Este mes</div>';
    html += '<div class="stat-grid" style="margin-bottom:22px;">';
    html += statTileHtml('Ingresos', fmtMoney(ingresos), 'good', 'Incluye préstamos recibidos y abonos que te paguen');
    html += statTileHtml('Salió de tu bolsillo', fmtMoney(salidasEfectivo), null, 'Efectivo/débito + tarjetas + BNPL + préstamos que des o pagues');
    html += statTileHtml('Balance del mes', fmtMoney(balance), balance>=0?'good':'critical');
    html += statTileHtml('Deuda en tarjetas hoy', fmtMoney(deudaTotal), deudaTotal>0?'critical':null, usoPct!==null?(usoPct+'% de tu línea total'):null);
    html += '</div>';

    if (monthMovs.filter(function(m){return m.tipo==='gasto';}).length){
      html += '<div class="card" style="margin-bottom:22px;">';
      html += '<div class="section-title" style="margin-bottom:12px;">Gasto por categoría</div>';
      html += categoryBarsHtml(monthMovs.filter(function(m){return m.tipo==='gasto';}));
      html += '<div class="hint" style="margin-top:10px; font-size:0.72rem; color:var(--ink-400);">Incluye compras a crédito, aunque el pago salga de tu bolsillo después.</div>';
      html += '</div>';
    }

    html += '<div class="eyebrow" style="margin-bottom:8px;">Al día de hoy</div>';
    if (!creditCards.length){
      html += '<div class="empty-state" style="margin-bottom:22px;"><div class="big-ic">▭</div><h3>Aún no registras tarjetas</h3><p>Agrega tus tarjetas de crédito para ver aquí tus próximos vencimientos y tu deuda total.</p><button class="btn btn-primary" data-act="open-card-form">Agregar tarjeta</button></div>';
    } else {
      var withDates = creditCards.map(function(c){
        var pago = nextOccurrenceOfDay(hoy, Number(c.diaPago));
        var dias = daysBetween(hoy, pago);
        return { card:c, pago:pago, dias:dias, status: statusForDays(dias) };
      }).sort(function(a,b){ return a.dias - b.dias; });
      html += '<div class="card" style="margin-bottom:22px;"><div class="section-title" style="margin-bottom:10px;">Próximos vencimientos</div><div class="stack" style="gap:0;">';
      withDates.forEach(function(w){
        html += '<div class="row between" style="padding:10px 0; border-bottom:1px solid var(--line);">' +
          '<div><div style="font-weight:500; font-size:0.88rem;">' + escapeHtml(w.card.alias) + '</div>' +
          '<div style="font-size:0.76rem; color:var(--ink-400);">Pago límite: ' + fmtDateShort(w.pago) + ' · Saldo ' + fmtMoney(saldoTarjeta(w.card.id, movs)) + '</div></div>' +
          '<span class="pill ' + w.status + '"><span class="dot ' + w.status + '"></span>' + statusLabel(w.status, w.dias) + '</span>' +
        '</div>';
      });
      html = html.slice(0, html.length); // no-op, mantiene estructura
      html += '</div></div>';
    }

    html += proximosMesesHtml();

    var activePlazos = movs.filter(function(m){ return m.esPlazos && plazoInfo(m).restantes > 0; });
    html += '<div class="eyebrow" style="margin-bottom:8px;">Compras a meses activas</div>';
    if (!activePlazos.length){
      html += '<div class="card muted" style="font-size:0.86rem; padding:16px;">No tienes compras a meses (MSI) o "compra ahora, paga después" activas.</div>';
    } else {
      html += '<div class="card"><div class="stack" style="gap:0;">';
      activePlazos.slice(0,6).forEach(function(m){
        var info = plazoInfo(m);
        html += plazoItemHtml(m, info);
      });
      html += '</div></div>';
    }

    return html;
  }

  function categoryBarsHtml(gastoMovs){
    var byCat = {};
    gastoMovs.forEach(function(m){ byCat[m.categoria||'Otros'] = (byCat[m.categoria||'Otros']||0) + Number(m.monto||0); });
    var entries = Object.keys(byCat).map(function(k){ return [k, byCat[k]]; }).sort(function(a,b){ return b[1]-a[1]; });
    var max = entries.length ? entries[0][1] : 1;
    return '<div class="barchart">' + entries.map(function(e){
      var pct = Math.max(4, Math.round((e[1]/max)*100));
      return '<div class="bar-row"><div class="name">' + escapeHtml(e[0]) + '</div>' +
        '<div class="bar-track"><div class="bar-fill" style="width:'+pct+'%; background:'+catColorVar(e[0])+';"></div></div>' +
        '<div class="val">' + fmtMoney(e[1]) + '</div></div>';
    }).join('') + '</div>';
  }

  // El avance de las compras a meses es 100% manual: tú marcas cada mensualidad
  // como pagada conforme la ves reflejada en tu estado de cuenta. No se estima
  // ni se inventa ninguna fecha de pago — lo único que calculamos es, a modo de
  // referencia, a qué corte del calendario correspondería cada mensualidad según
  // tu fecha de compra y el día de corte de la tarjeta, para ayudarte a ubicar
  // dónde vas al ponerte al corriente con compras de meses anteriores.
  function addMonthsClamped(date, months){
    var d = date.getDate();
    var y = date.getFullYear(), m = date.getMonth() + months;
    var ny = y + Math.floor(m/12), nm = ((m%12)+12)%12;
    var lastDay = new Date(ny, nm+1, 0).getDate();
    return new Date(ny, nm, Math.min(d, lastDay));
  }
  function cycleDateForInstallment(mov, index){
    var card = mov.cardId ? findCard(mov.cardId) : null;
    var cicloDia = (mov.tipoPlazo!=='bnpl' && card) ? Number(card.diaCorte) : parseISO(mov.fecha).getDate();
    var first = nextOccurrenceOfDay(parseISO(mov.fecha), cicloDia);
    return addMonthsClamped(first, index-1);
  }
  function fmtMonthYear(d){ return MESES_CORTOS[d.getMonth()] + ' ' + d.getFullYear(); }

  // Calendario de próximos meses: solo compras a meses (MSI/BNPL) activas, proyectadas
  // con la misma fecha aproximada de corte que ya usamos en "Siguiente: pago N/Total".
  // Los pagos vencidos (de meses anteriores a hoy) que aún no marcaste como pagados se
  // agrupan en el mes actual, para que no desaparezcan del total. Nada se inventa: si no
  // tienes compras a meses activas, no se muestra esta sección.
  var FORECAST_MESES = 6;
  function proximosMesesHtml(){
    var activos = getMovs().filter(function(m){ return m.esPlazos && plazoInfo(m).restantes > 0; });
    if (!activos.length) return '';

    var hoy = todayDate();
    var mesInicio = new Date(hoy.getFullYear(), hoy.getMonth(), 1);
    var meses = [];
    for (var i = 0; i < FORECAST_MESES; i++){
      var d = addMonthsClamped(mesInicio, i);
      meses.push({ key: monthKey(d), label: fmtMonthYear(d) });
    }
    var keyToIdx = {};
    meses.forEach(function(mm, idx){ keyToIdx[mm.key] = idx; });
    var keyHoy = monthKey(hoy);

    var rows = {}, order = [];
    var totals = meses.map(function(){ return 0; });

    activos.forEach(function(m){
      var info = plazoInfo(m);
      var rowKey, rowLabel;
      if (m.tipoPlazo === 'bnpl'){
        rowKey = 'bnpl_' + (m.proveedor || '—');
        rowLabel = 'BNPL · ' + (m.proveedor || 'proveedor');
      } else {
        var card = m.cardId ? findCard(m.cardId) : null;
        rowKey = 'card_' + (m.cardId || 'sin');
        rowLabel = card ? card.alias : 'Tarjeta';
      }
      if (!rows[rowKey]){ rows[rowKey] = { label: rowLabel, amounts: meses.map(function(){return 0;}) }; order.push(rowKey); }

      for (var idx = info.pagados + 1; idx <= info.total; idx++){
        var fecha = cycleDateForInstallment(m, idx);
        var mk = monthKey(fecha);
        var bucket = (mk in keyToIdx) ? keyToIdx[mk] : (mk < keyHoy ? 0 : -1);
        if (bucket === -1) continue; // más allá del horizonte de 6 meses, no se muestra
        rows[rowKey].amounts[bucket] += info.mensualidad;
        totals[bucket] += info.mensualidad;
      }
    });

    order.sort(function(a,b){
      var sa = rows[a].amounts.reduce(function(s,x){return s+x;},0);
      var sb = rows[b].amounts.reduce(function(s,x){return s+x;},0);
      return sb - sa;
    });

    var html = '<div class="card" style="margin-bottom:22px;">';
    html += '<div class="section-title" style="margin-bottom:10px;">Calendario de próximos meses</div>';
    html += '<div class="forecast-scroll"><table class="forecast-table"><thead><tr><th></th>' +
      meses.map(function(mm){ return '<th>' + mm.label + '</th>'; }).join('') + '</tr></thead><tbody>';
    order.forEach(function(k){
      var r = rows[k];
      html += '<tr><td class="rowlbl">' + escapeHtml(r.label) + '</td>' +
        r.amounts.map(function(a){ return a > 0 ? ('<td>' + fmtMoney(a) + '</td>') : '<td class="zero">—</td>'; }).join('') +
        '</tr>';
    });
    html += '<tr class="totalrow"><td class="rowlbl">Total</td>' +
      totals.map(function(t){ return '<td>' + fmtMoney(t) + '</td>'; }).join('') + '</tr>';
    html += '</tbody></table></div>';
    html += '<div class="hint" style="margin-top:10px; font-size:0.72rem; color:var(--ink-400);">Solo incluye tus compras a meses (MSI/BNPL) activas — no incluye compras normales a crédito que aún no registras, ni préstamos. Los pagos vencidos que no has marcado como pagados se agrupan en el mes actual.</div>';
    html += '</div>';
    return html;
  }

  function plazoInfo(mov){
    var pagos = mov.pagos || [];
    var total = Number(mov.plazosTotal) || 1;
    var pagados = Math.min(pagos.length, total);
    var restantes = Math.max(0, total - pagados);
    var mensualidad = Math.round((Number(mov.monto)/total) * 100) / 100;
    return { pagados: pagados, total: total, restantes: restantes, mensualidad: mensualidad };
  }

  function plazoItemHtml(m, info){
    var etiqueta = m.tipoPlazo==='bnpl' ? ('Compra ahora, paga después · ' + (m.proveedor||'proveedor')) : ('MSI · ' + ((findCard(m.cardId)||{}).alias || 'tarjeta'));
    var notaBnpl = m.tipoPlazo==='bnpl' ? ' · al marcar un mes se cuenta como salida de tu bolsillo' : ' · se paga junto con el estado de cuenta de tu tarjeta';
    var siguienteTxt = '';
    if (info.restantes > 0){
      var fechaEstim = cycleDateForInstallment(m, info.pagados + 1);
      siguienteTxt = '<div class="muted" style="font-size:0.74rem; margin-top:2px;">Siguiente: pago ' + (info.pagados+1) + '/' + info.total + ' · corresponde aprox. a tu corte de <strong style="color:var(--ink-600);">' + fmtMonthYear(fechaEstim) + '</strong></div>';
    }
    return '<div class="plazo-item">' +
      '<div class="plazo-top"><div class="desc">' + escapeHtml(m.descripcion || m.categoria || 'Compra a meses') + '</div><div class="tot">' + fmtMoney(m.monto) + '</div></div>' +
      '<div class="muted" style="font-size:0.76rem;">' + escapeHtml(etiqueta) + escapeHtml(notaBnpl) + '</div>' +
      '<div class="limit-bar" style="margin:8px 0 6px;"><div style="width:' + Math.round((info.pagados/info.total)*100) + '%;"></div></div>' +
      '<div class="plazo-meta"><span>' + info.pagados + ' de ' + info.total + ' pagadas · ' + fmtMoney(info.mensualidad) + '/mes</span>' +
      '<span>' + (info.restantes>0 ? (info.restantes + ' restantes') : 'Liquidada') + '</span></div>' +
      siguienteTxt +
      '<div class="row" style="gap:8px; margin-top:9px;">' +
        (info.restantes>0 ? '<button class="btn btn-line btn-sm" data-act="mark-plazo" data-id="'+m.id+'">Marcar mes pagado</button>' : '') +
        (info.pagados>0 ? '<button class="icon-btn" data-act="undo-plazo" data-id="'+m.id+'" title="Deshacer último mes marcado">↺</button>' : '') +
      '</div>' +
    '</div>';
  }

  function renderMovimientos(){
    var movs = getMovs().filter(function(m){ return monthKey(parseISO(m.fecha)) === ui.monthKey; })
      .sort(function(a,b){ return b.fecha.localeCompare(a.fecha) || 0; });
    var html = monthNavHtml();
    if (!movs.length){
      html += '<div class="empty-state"><div class="big-ic">≡</div><h3>Sin movimientos este mes</h3><p>Registra tus ingresos y gastos cada noche para tener un panorama real de tus finanzas.</p><button class="btn btn-primary" data-act="open-mov-form">Agregar movimiento</button></div>';

    var byDay = {};

      byDay[fecha].forEach(function(m){
        html += movRowHtml(m, cards);
      });
      html += '</div>';

    html += '</div>';

  function movIconAndColor(m){
    if (m.tipo==='ingreso') return { ic:'↓', color:'var(--good)' };
    if (m.tipo==='pago_tarjeta') return { ic:'▭', color:'var(--brand)' };

  function movRowHtml(m, cards){

      '<div class="mov-info"><div class="t1">' + escapeHtml(m.descripcion || m.categoria || (m.tipo==='pago_tarjeta'?'Pago a tarjeta':'Movimiento')) + '</div>' +
      '<div class="t2">' + escapeHtml(metodoTxt) + (m.esPlazos ? ' · a meses' : '') + '</div></div>' +
      '<div class="mov-amt ' + amtCls + '">' + sign + fmtMoney(m.monto) + '</div>' +

      return html;
    }
    html += '<div class="stack">';

      if (c.tipo === 'credito'){
        var saldo = saldoTarjeta(c.id, movs);

        var corte = nextOccurrenceOfDay(hoy, Number(c.diaCorte));

          '<span class="pill ' + status + '"><span class="dot ' + status + '"></span>' + statusLabel(status, diasPago) + '</span></div>';
        html += '<div class="card-balance"><span class="muted" style="font-size:0.78rem;">Saldo registrado</span><span class="amt">' + fmtMoney(saldo) + '</span></div>';
        if (limite>0){
          html += '<div class="limit-bar"><div style="width:'+pct+'%; background:'+(pct>=90?'var(--critical)':'var(--accent)')+';"></div></div>';
          html += '<div class="muted" style="font-size:0.74rem;">' + pct + '% de tu línea de ' + fmtMoney(limite) + '</div>';
        }
        html += '<div class="card-dates">' +
          '<div><span class="k">Corte </span><span class="v">' + fmtDateShort(corte) + '</span></div>' +
          '<div><span class="k">Pago límite </span><span class="v">' + fmtDateShort(pago) + '</span></div>' +
          (c.pagoMinimo ? ('<div><span class="k">Mínimo </span><span class="v">' + fmtMoney(c.pagoMinimo) + '</span></div>') : '') +
        '</div>';
        html += '<div class="row" style="gap:8px;"><button class="btn btn-line btn-sm" data-act="export-ics" data-id="' + c.id + '">Añadir a calendario</button></div>';
        html += '</div>';
      } else {
        html += '<div class="ledger-card" data-act="open-card-form" data-id="' + c.id + '">';
        html += '<div class="card-head">' + cardAvatarHtml(c) +
          '<div class="names"><div class="alias">' + escapeHtml(c.alias) + '</div><div class="bank">' + escapeHtml(c.banco) + (c.ultimos4?(' •••• '+escapeHtml(c.ultimos4)):'') + '</div></div>' +
          '<span class="pill neutral"><span class="dot neutral"></span>Débito</span></div>';
        html += '<div class="muted" style="font-size:0.78rem;">El saldo real de esta cuenta se consulta en tu banco; aquí solo llevamos el registro de tus movimientos.</div>';
        html += '</div>';
      }
    });
    html += '</div>';
    return html;
  }

  function cardAvatarHtml(c){
    var initials = (c.banco||'??').trim().slice(0,2).toUpperCase();
    var bg = c.tipo==='credito' ? 'var(--brand)' : 'var(--ink-400)';
    return '<div class="card-avatar" style="background:' + bg + ';">' + escapeHtml(initials) + '</div>';

  function renderPlazos(){
    var movs = getMovs().filter(function(m){ return m.esPlazos; });
    if (!movs.length){
      return '<div class="empty-state"><div class="big-ic">⋯</div><h3>Sin compras a meses</h3><p>Cuando registres una compra a MSI o "compra ahora, paga después", aparecerá aquí con su avance.</p><button class="btn btn-primary" data-act="open-mov-form">Agregar movimiento</button></div>';
    }
    var withInfo = movs.map(function(m){ return { m:m, info: plazoInfo(m) }; });
    withInfo.sort(function(a,b){

      return a.info.restantes - b.info.restantes;
    });
    var activas = withInfo.filter(function(w){ return w.info.restantes>0; });
    var liquidadas = withInfo.filter(function(w){ return w.info.restantes===0; });
    var html = '';

      html += '<div class="eyebrow" style="margin-bottom:8px;">Activas</div><div class="card" style="margin-bottom:20px;"><div class="stack" style="gap:0;">';
      activas.forEach(function(w){ html += plazoItemHtml(w.m, w.info); });

      html += '<div class="eyebrow" style="margin-bottom:8px;">Liquidadas</div><div class="card"><div class="stack" style="gap:0;">';
      liquidadas.forEach(function(w){ html += plazoItemHtml(w.m, w.info); });

  function renderPrestamos(){
    var loans = getLoans();
    if (!loans.length){
      return '<div class="empty-state"><div class="big-ic">⇄</div><h3>Sin préstamos registrados</h3><p>Lleva el control de dinero que prestas a alguien o que te prestan a ti (persona o institución), con su tasa de interés si aplica.</p><button class="btn btn-primary" data-act="open-loan-form">Agregar préstamo</button></div>';

      if ((a.saldo>0) !== (b.saldo>0)) return a.saldo>0 ? -1 : 1;
      if (a.l.fechaVencimiento && b.l.fechaVencimiento) return a.l.fechaVencimiento.localeCompare(b.l.fechaVencimiento);

      if (b.l.fechaVencimiento) return 1;
      return (b.l.fecha||'').localeCompare(a.l.fecha||'');

      html += '</div></div>';
    }
    return html;
  }

  function setupMovFormLogic(initialTipo, initialMetodo, existing){
    var state = { tipo: initialTipo, metodo: initialMetodo };
    function applyVisibility(){
      var isBnpl = state.metodo==='bnpl';
      byId('wrap-metodo').hidden = state.tipo !== 'gasto';
      byId('wrap-categoria').hidden = state.tipo === 'pago_tarjeta';
      byId('wrap-card-debito').hidden = !(state.tipo==='gasto' && state.metodo==='efectivo');
      byId('wrap-card-credito').hidden = !(state.tipo==='gasto' && state.metodo==='credito');
      byId('wrap-card-pago').hidden = state.tipo !== 'pago_tarjeta';
      byId('wrap-esplazos').hidden = !(state.tipo==='gasto' && state.metodo==='credito');
      byId('wrap-proveedor').hidden = !(state.tipo==='gasto' && isBnpl);
      var showPlazos = (state.tipo==='gasto') && (isBnpl || (state.metodo==='credito' && byId('f-esplazos').checked));
      byId('wrap-plazos').hidden = !showPlazos;
    }
    function byId(id){ return document.getElementById(id); }

    document.querySelectorAll('#tipo-seg button').forEach(function(b){
      b.addEventListener('click', function(){
        state.tipo = b.dataset.tipo;
        document.querySelectorAll('#tipo-seg button').forEach(function(x){ x.setAttribute('aria-selected', x===b); });
        var cats = state.tipo==='ingreso'?INGRESO_CATS:GASTO_CATS;
        document.getElementById('cat-list').innerHTML = cats.map(function(c){return '<option value="'+escapeHtml(c)+'">';}).join('');
        applyVisibility();
      });
    });
    document.querySelectorAll('#metodo-seg button').forEach(function(b){
      b.addEventListener('click', function(){
        state.metodo = b.dataset.metodo;
        document.querySelectorAll('#metodo-seg button').forEach(function(x){ x.setAttribute('aria-selected', x===b); });
        applyVisibility();
      });
    });
    byId('f-esplazos').addEventListener('change', applyVisibility);
    applyVisibility();

    document.getElementById('mov-form').addEventListener('submit', async function(ev){
      ev.preventDefault();
      var errEl = byId('form-error'); errEl.hidden = true;
      var fecha = byId('f-fecha').value;
      var monto = parseFloat(byId('f-monto').value);
      if (!fecha || !monto || monto<=0){ errEl.textContent='Revisa la fecha y el monto.'; errEl.hidden=false; return; }
      var data = { tipo: state.tipo, fecha: fecha, monto: Math.round(monto*100)/100, descripcion: byId('f-desc').value.trim() };
      if (state.tipo === 'pago_tarjeta'){
        var cid = byId('f-card-pago').value;
        if (!cid){ errEl.textContent='Elige a qué tarjeta corresponde el pago.'; errEl.hidden=false; return; }
        data.cardId = cid; data.categoria = 'Pago de tarjeta';
      } else {
        data.categoria = byId('f-categoria').value.trim() || 'Otros';
        if (state.tipo === 'gasto'){
          data.metodo = state.metodo;
          if (state.metodo === 'credito'){
            var cc = byId('f-card-credito').value;
            if (!cc){ errEl.textContent='Elige con qué tarjeta de crédito pagaste.'; errEl.hidden=false; return; }
            data.cardId = cc;
            data.esPlazos = byId('f-esplazos').checked;
            if (data.esPlazos){
              var pl = parseInt(byId('f-plazos').value, 10);
              if (!pl || pl<2){ errEl.textContent='Indica a cuántos meses es la compra (mínimo 2).'; errEl.hidden=false; return; }
              data.plazosTotal = pl; data.tipoPlazo = 'msi';
            }
          } else if (state.metodo === 'bnpl'){
            data.cardId = null;
            data.proveedor = byId('f-proveedor').value.trim();
            if (!data.proveedor){ errEl.textContent='Indica el proveedor (ej. Kueski Pay, Aplazo).'; errEl.hidden=false; return; }
            var pl2 = parseInt(byId('f-plazos').value, 10);
            if (!pl2 || pl2<2){ errEl.textContent='Indica a cuántos pagos es la compra (mínimo 2).'; errEl.hidden=false; return; }
            data.plazosTotal = pl2; data.esPlazos = true; data.tipoPlazo = 'bnpl';
          } else {
            data.cardId = byId('f-card-debito').value || null;
          }
        }
      }
      var submitBtn = ev.target.querySelector('button[type="submit"]');
      submitBtn.disabled = true; submitBtn.textContent = 'Guardando…';
      try{
        if (existing) await updateMov(existing.id, data); else await addMov(data);
      }catch(e){ submitBtn.disabled = false; submitBtn.textContent = 'Guardar'; return; }
      closeModal(); ui.monthKey = monthKey(parseISO(data.fecha)); render();
      toast(existing ? 'Movimiento actualizado' : 'Movimiento guardado');
    });

    if (existing){
      document.getElementById('mov-delete').addEventListener('click', function(){
        confirmModal('Eliminar movimiento', '¿Seguro que quieres eliminarlo? Esta acción no se puede deshacer.', 'Eliminar', async function(){
          try{ await removeMov(existing.id); }catch(e){ return; }
          render(); toast('Movimiento eliminado');
        });
      });
    }
  }

     ============================================================ */
  async function doDownload(filename, text, mime){
    var blob = new Blob([text], { type: mime || 'application/octet-stream' });
    var dl = window.__downloadsCap;
    if (dl){
      try{ await dl.save({ filename: filename, data: blob }); return; }catch(e){ /* cae a método alterno abajo */ }
    }
    try{
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove();
      setTimeout(function(){ URL.revokeObjectURL(url); }, 4000);
    }catch(e){ toast('No se pudo generar el archivo en este navegador.'); }
  }

  function exportJSON(){
    var payload = { version:1, exportedAt: new Date().toISOString(), cards:getCards(), movs:getMovs(), loans:getLoans() };
    doDownload('on-track-respaldo-' + toISO(todayDate()) + '.json', JSON.stringify(payload, null, 2), 'application/json');
  }

  function importJSONFile(file){
    var reader = new FileReader();
    reader.onload = function(){
      var data;
      try{ data = JSON.parse(reader.result); }catch(e){ toast('El archivo no es un respaldo válido.'); return; }
      if (!data || !Array.isArray(data.cards) || !Array.isArray(data.movs)){ toast('El archivo no tiene el formato esperado.'); return; }
      var loans = Array.isArray(data.loans) ? data.loans : [];
      confirmModal('Restaurar respaldo', 'Esto reemplazará TODOS los datos actuales de tu cuenta por los del archivo (' + data.cards.length + ' tarjetas, ' + data.movs.length + ' movimientos, ' + loans.length + ' préstamos). Esto puede tardar unos segundos — no cierres la app mientras tanto. ¿Continuar?', 'Restaurar', async function(){
        toast('Restaurando…');
        try{
          await wipeAllRemote();
          for (var i=0;i<data.cards.length;i++){ var c=Object.assign({},data.cards[i]); delete c.id; await addCard(c); }
          for (var i=0;i<data.movs.length;i++){ var m=Object.assign({},data.movs[i]); delete m.id; await addMov(m); }
          for (var i=0;i<loans.length;i++){ var l=Object.assign({},loans[i]); delete l.id; await addLoan(l); }
        }catch(e){ render(); toast('Ocurrió un error restaurando — revisa tu información antes de continuar.'); return; }
        render(); toast('Respaldo restaurado');
      });
    };
    reader.readAsText(file);
  }

  function icsDate(d){ return d.getFullYear()+pad(d.getMonth()+1)+pad(d.getDate()); }
  function exportCardICS(cardId){
    var c = findCard(cardId); if (!c || c.tipo!=='credito') return;
    var hoy = todayDate();
    var corte = nextOccurrenceOfDay(hoy, Number(c.diaCorte));
    var pago = nextOccurrenceOfDay(hoy, Number(c.diaPago));
    function vevent(uidSuffix, title, date, desc){
      return ['BEGIN:VEVENT','UID:'+uidSuffix+'-'+c.id+'@on-track','DTSTAMP:'+icsDate(hoy)+'T000000Z',
        'DTSTART;VALUE=DATE:'+icsDate(date),'DTEND;VALUE=DATE:'+icsDate(new Date(date.getFullYear(),date.getMonth(),date.getDate()+1)),
        'SUMMARY:'+title,'DESCRIPTION:'+desc,
        'RRULE:FREQ=MONTHLY;BYMONTHDAY='+date.getDate(),
        'BEGIN:VALARM','ACTION:DISPLAY','DESCRIPTION:Recordatorio','TRIGGER:-P1D','END:VALARM',
        'END:VEVENT'].join('\r\n');
    }
    var ics = ['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//On Track//ES','CALSCALE:GREGORIAN',
      vevent('corte', 'Corte '+c.alias, corte, 'Fecha de corte de '+c.alias+' ('+c.banco+')'),
      vevent('pago', 'Pago límite '+c.alias, pago, 'Fecha límite de pago de '+c.alias+' ('+c.banco+'). Saldo registrado: '+fmtMoney(saldoTarjeta(c.id))),
      'END:VCALENDAR'].join('\r\n');
    doDownload('corte-pago-' + c.alias.replace(/[^a-z0-9]+/gi,'-').toLowerCase() + '.ics', ics, 'text/calendar');
  }

  function wipeData(){
    confirmModal('Borrar todos los datos', 'Se eliminarán todas tus tarjetas, movimientos y préstamos de tu cuenta, en todos los dispositivos donde inicies sesión. Esta acción no se puede deshacer. Considera descargar un respaldo antes.', 'Borrar todo', async function(){
      toast('Borrando…');
      try{ await wipeAllRemote(); }catch(e){ render(); toast('Ocurrió un error borrando tu información.'); return; }
      render(); toast('Datos borrados');
    });
  }

  /* ============================================================
     7. EVENTOS
     ============================================================ */
  function wireViewEvents(){
    viewRoot.querySelectorAll('[data-act="open-mov-form"]').forEach(function(b){ b.addEventListener('click', function(){ openMovForm(null); }); });
    viewRoot.querySelectorAll('[data-act="open-card-form"]').forEach(function(b){ b.addEventListener('click', function(){ openCardForm(b.dataset.id||null); }); });
    viewRoot.querySelectorAll('[data-act="edit-mov"]').forEach(function(b){ b.addEventListener('click', function(){ openMovForm(b.dataset.id); }); });
    viewRoot.querySelectorAll('[data-act="export-ics"]').forEach(function(b){ b.addEventListener('click', function(ev){ ev.stopPropagation(); exportCardICS(b.dataset.id); }); });
    viewRoot.querySelectorAll('[data-act="export-json"]').forEach(function(b){ b.addEventListener('click', exportJSON); });
    viewRoot.querySelectorAll('[data-act="mark-plazo"]').forEach(function(b){ b.addEventListener('click', async function(ev){ ev.stopPropagation(); try{ await markPlazoPaid(b.dataset.id); }catch(e){ return; } render(); }); });
    viewRoot.querySelectorAll('[data-act="undo-plazo"]').forEach(function(b){ b.addEventListener('click', async function(ev){ ev.stopPropagation(); try{ await undoPlazoPaid(b.dataset.id); }catch(e){ return; } render(); }); });
    viewRoot.querySelectorAll('[data-act="open-loan-form"]').forEach(function(b){ b.addEventListener('click', function(){ openLoanForm(b.dataset.id||null); }); });
    viewRoot.querySelectorAll('[data-act="add-abono"]').forEach(function(b){ b.addEventListener('click', function(ev){ ev.stopPropagation(); openAbonoForm(b.dataset.id); }); });
    viewRoot.querySelectorAll('[data-act="undo-abono"]').forEach(function(b){ b.addEventListener('click', async function(ev){ ev.stopPropagation(); try{ await undoAbono(b.dataset.id); }catch(e){ return; } render(); }); });
    viewRoot.querySelectorAll('[data-act="wipe-data"]').forEach(function(b){ b.addEventListener('click', wipeData); });
    viewRoot.querySelectorAll('[data-act="logout"]').forEach(function(b){ b.addEventListener('click', logout); });
    var importInput = document.getElementById('import-file');
    if (importInput) importInput.addEventListener('change', function(){ if (importInput.files[0]) importJSONFile(importInput.files[0]); importInput.value=''; });
    viewRoot.querySelectorAll('[data-act="month-prev"]').forEach(function(b){ b.addEventListener('click', function(){ var p=ui.monthKey.split('-').map(Number); var d=new Date(p[0],p[1]-2,1); ui.monthKey=monthKey(d); render(); }); });
    viewRoot.querySelectorAll('[data-act="month-next"]').forEach(function(b){ b.addEventListener('click', function(){ var p=ui.monthKey.split('-').map(Number); var d=new Date(p[0],p[1],1); ui.monthKey=monthKey(d); render(); }); });
  }

  document.addEventListener('click', function(ev){
    var navBtn = ev.target.closest('[data-view]');
    if (navBtn){ ui.view = navBtn.dataset.view; render(); return; }
    if (ev.target.id === 'fab-add'){
      if (ui.view === 'tarjetas') openCardForm(null);
      else if (ui.view === 'prestamos') openLoanForm(null);
      else openMovForm(null);
      return;
    }
    if (ev.target.closest('[data-act="modal-cancel"]')){ closeModal(); return; }
    if (ev.target.dataset && ev.target.dataset.act === 'modal-overlay'){ closeModal(); return; }
  });

  /* ============================================================
     8. AUTENTICACIÓN (PIN) + CARGA DE DATOS + REFRESCO
     ============================================================ */
  function setConnStatus(ok){
    var badge = document.getElementById('sync-badge');
    var text = document.getElementById('sync-badge-text');
    if (!badge || !text) return;
    badge.classList.remove('local','readonly');
    if (ok){ text.textContent = 'Sincronizado'; }
    else { badge.classList.add('readonly'); text.textContent = 'Sin conexión'; }
  }

  function loadRememberedAuth(){
    try{
      var raw = localStorage.getItem(AUTH_CACHE_KEY);
      if (!raw) return null;
      var data = JSON.parse(raw);
      if (data && data.personId === PERSON_ID && data.pinHash) return data.pinHash;
    }catch(e){ /* nada guardado */ }
    return null;
  }
  function rememberAuth(pinHash){
    try{ localStorage.setItem(AUTH_CACHE_KEY, JSON.stringify({ personId: PERSON_ID, pinHash: pinHash })); }catch(e){ /* no crítico */ }
  }
  function forgetAuth(){
    try{ localStorage.removeItem(AUTH_CACHE_KEY); }catch(e){ /* no crítico */ }
  }

  function showApp(){
    document.getElementById('auth-gate').hidden = true;
    document.getElementById('app').hidden = false;
    render();
    startAutoRefresh();
  }

  async function completeLogin(pinHash, remember){
    AUTH.pinHash = pinHash;
    var authBody = document.getElementById('auth-body');
    authBody.innerHTML = '<p class="secondary-text" style="text-align:center;">Cargando tu información…</p>';
    try{
      await loadAllData();
    }catch(e){
      authBody.innerHTML = '<p class="error-text" style="text-align:center;">No se pudo cargar tu información. Revisa tu internet e intenta de nuevo.</p>';
      renderLoginForm();
      return;
    }
    if (remember) rememberAuth(pinHash);
    setConnStatus(true);
    showApp();
  }

  function renderSetupForm(){
    var authBody = document.getElementById('auth-body');
    authBody.innerHTML =
      '<p class="secondary-text" style="margin:0 0 16px; font-size:0.9rem;">Es la primera vez que abres tu app. Crea un PIN de 4 a 8 dígitos para proteger tu información — solo tú lo necesitas.</p>' +
      '<form id="setup-form" class="stack">' +
        '<div class="field"><label for="su-pin">Crea tu PIN</label><input type="password" inputmode="numeric" id="su-pin" minlength="4" maxlength="8" required></div>' +
        '<div class="field"><label for="su-pin2">Confirma tu PIN</label><input type="password" inputmode="numeric" id="su-pin2" minlength="4" maxlength="8" required></div>' +
        '<div class="error-text" id="setup-error" hidden></div>' +
        '<div class="form-actions"><button type="submit" class="btn btn-primary btn-block">Crear mi PIN y entrar</button></div>' +
      '</form>';
    document.getElementById('setup-form').addEventListener('submit', async function(ev){
      ev.preventDefault();
      var errEl = document.getElementById('setup-error'); errEl.hidden = true;
      var p1 = document.getElementById('su-pin').value.trim();
      var p2 = document.getElementById('su-pin2').value.trim();
      if (!/^\d{4,8}$/.test(p1)){ errEl.textContent='El PIN debe tener de 4 a 8 dígitos.'; errEl.hidden=false; return; }
      if (p1 !== p2){ errEl.textContent='Los PIN no coinciden.'; errEl.hidden=false; return; }
      var btn = ev.target.querySelector('button[type="submit"]'); btn.disabled = true; btn.textContent = 'Creando…';
      try{
        var hash = await sha256Hex(p1);
        var res = await apiPost({ action:'setup', personId:PERSON_ID, nombre:PERSON_ID, pinHash:hash });
        if (!res.ok){
          errEl.textContent = res.error === 'ya_existe' ? 'Ya existe un PIN para esta cuenta — recarga la página e ingresa con él.' : 'No se pudo crear tu PIN. Intenta de nuevo.';
          errEl.hidden = false; btn.disabled = false; btn.textContent = 'Crear mi PIN y entrar';
          return;
        }
        await completeLogin(hash, true);
      }catch(e){
        errEl.textContent = 'Sin conexión — revisa tu internet e intenta de nuevo.'; errEl.hidden = false;
        btn.disabled = false; btn.textContent = 'Crear mi PIN y entrar';
      }
    });
  }

  function renderLoginForm(){
    var authBody = document.getElementById('auth-body');
    authBody.innerHTML =
      '<form id="login-form" class="stack">' +
        '<div class="field"><label for="li-pin">Tu PIN</label><input type="password" inputmode="numeric" id="li-pin" minlength="4" maxlength="8" required autofocus></div>' +
        '<div class="checkline"><input type="checkbox" id="li-remember" checked><label for="li-remember">Recordar en este dispositivo</label></div>' +
        '<div class="error-text" id="login-error" hidden></div>' +
        '<div class="form-actions"><button type="submit" class="btn btn-primary btn-block">Entrar</button></div>' +
      '</form>';
    document.getElementById('login-form').addEventListener('submit', async function(ev){
      ev.preventDefault();
      var errEl = document.getElementById('login-error'); errEl.hidden = true;
      var pin = document.getElementById('li-pin').value.trim();
      var remember = document.getElementById('li-remember').checked;
      if (!pin) return;
      var btn = ev.target.querySelector('button[type="submit"]'); btn.disabled = true; btn.textContent = 'Entrando…';
      try{
        var hash = await sha256Hex(pin);
        var res = await apiPost({ action:'login', personId:PERSON_ID, pinHash:hash });
        if (!res.ok){
          errEl.textContent = 'PIN incorrecto.'; errEl.hidden = false;
          btn.disabled = false; btn.textContent = 'Entrar';
          return;
        }
        await completeLogin(hash, remember);
      }catch(e){
        errEl.textContent = 'Sin conexión — revisa tu internet e intenta de nuevo.'; errEl.hidden = false;
        btn.disabled = false; btn.textContent = 'Entrar';
      }
    });
  }

  function logout(){
    confirmModal('Cerrar sesión', 'Se cerrará tu sesión en este dispositivo. Necesitarás tu PIN para volver a entrar.', 'Cerrar sesión', function(){
      forgetAuth();
      location.reload();
    });
  }

  var refreshTimer = null;
  function refreshDataQuiet(){
    loadAllData().then(function(){ setConnStatus(true); render(); }).catch(function(){ setConnStatus(false); });
  }
  function startAutoRefresh(){
    if (refreshTimer) clearInterval(refreshTimer);
    refreshTimer = setInterval(function(){
      if (document.hidden) return;
      if (document.getElementById('modal-layer').innerHTML) return; // no interrumpir mientras editas algo
      refreshDataQuiet();
    }, 60000);
    document.addEventListener('visibilitychange', function(){
      if (!document.hidden && !document.getElementById('modal-layer').innerHTML) refreshDataQuiet();
    });
  }

  async function startAuthFlow(){
    var cachedHash = loadRememberedAuth();
    if (cachedHash){
      document.getElementById('auth-body').innerHTML = '<p class="secondary-text" style="text-align:center;">Entrando…</p>';
      try{
        var res = await apiPost({ action:'login', personId:PERSON_ID, pinHash:cachedHash });
        if (res.ok){ await completeLogin(cachedHash, true); return; }
      }catch(e){ /* seguimos a login manual si falla la red */ }
      forgetAuth();
    }
    try{
      var chk = await apiGet({ action:'check', personId:PERSON_ID });
      if (chk.ok && chk.existe) renderLoginForm();
      else renderSetupForm();
    }catch(e){
      document.getElementById('auth-body').innerHTML = '<p class="error-text" style="text-align:center;">No se pudo conectar. Revisa tu internet y recarga la página.</p>';
    }
  }

  async function init(){
    var w = window.innerWidth >= 860;
    document.getElementById('sidebar').hidden = !w;

    window.addEventListener('resize', function(){
      document.getElementById('sidebar').hidden = window.innerWidth < 860;
    });

    try{
      if (window.claude && window.claude.use){
        window.__downloadsCap = await window.claude.use('downloads');
      }
    }catch(e){ window.__downloadsCap = null; }

    startAuthFlow();
  }

  init();
})();
</script>
